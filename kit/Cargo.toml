[package]
name = "oracle-brand-kit"
description = "Oracle Brand Kit: a brand's logos, palette, type and rules, and its client deliveries."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oracle-brand-kit"
path = "src/main.rs"

[dependencies]
oracle-brand = { workspace = true }
oracle-style = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = "0.17"
dirs = "6"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
