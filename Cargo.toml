[workspace]
resolver = "3"
members = ["core", "style", "kit", "mockup"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
oracle-brand = { path = "core" }
oracle-style = { path = "style" }
oracle-library-ui = { path = "../oracle-library/ui" }
oracle-edit-algo = { path = "../oracle-edit/crates/algo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
resvg = "0.45"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "default_fonts"] }

[profile.release]
lto = "thin"

# Image work is far too slow unoptimised; the app's own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2
