[package]
name = "oracle-assets"
description = "Oracle Assets: the Oracle Library as an app of its own, outside the other Oracle apps."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oracle-assets"
path = "src/main.rs"

[dependencies]
oracle-style = { workspace = true }
oracle-library-ui = { workspace = true }
oracle-suite-link = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = "0.17"
dirs = "6"

# Dragging an asset out of the window to another app (Oracle Edit, the Explorer…).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2"

[build-dependencies]
winresource = "0.1"
